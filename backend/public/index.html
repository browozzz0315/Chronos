<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronos Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --surface-2: #0f141b;
    --border:  #30363d;
    --text:    #e6edf3;
    --muted:   #8b949e;
    --green:   #3fb950;
    --red:     #f85149;
    --yellow:  #d29922;
    --blue:    #58a6ff;
    --purple:  #bc8cff;
    --chart-grid: #21262d;
    --tooltip-bg: #161b22;
    --shadow: rgba(0, 0, 0, .25);
  }
  [data-theme="light"] {
    --bg:      #f3eee4;
    --surface: #fffaf0;
    --surface-2: #efe6d7;
    --border:  #d8cbb8;
    --text:    #26302c;
    --muted:   #6f766e;
    --green:   #237a47;
    --red:     #be3e37;
    --yellow:  #a66a10;
    --blue:    #2867a8;
    --purple:  #6f4db7;
    --chart-grid: #e2d6c4;
    --tooltip-bg: #fffaf0;
    --shadow: rgba(83, 61, 31, .12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px;
    display: flex; flex-direction: column; transition: background .2s ease, color .2s ease;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    background: var(--surface); box-shadow: 0 8px 30px var(--shadow);
    flex: 0 0 auto;
  }
  .brand { display: flex; flex-direction: column; gap: 3px; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: 2px; color: var(--blue); }
  header .meta { color: var(--muted); font-size: 12px; }
  #lastUpdate { color: var(--green); }
  .header-controls { display: flex; align-items: center; gap: 10px; }
  .symbol-button, .theme-toggle {
    min-height: 34px; border: 1px solid var(--border); border-radius: 999px;
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    color: var(--text); font-size: 12px; font-weight: 700;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 8px 24px var(--shadow);
  }
  .symbol-picker { position: relative; }
  .symbol-button {
    min-width: 132px; padding: 0 13px 0 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .symbol-button::after {
    content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-2px) rotate(45deg); transition: transform .18s ease;
  }
  .symbol-picker.open .symbol-button { border-color: var(--blue); }
  .symbol-picker.open .symbol-button::after { transform: translateY(2px) rotate(225deg); }
  .symbol-menu {
    display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 20;
    min-width: 150px; padding: 6px; border: 1px solid var(--border); border-radius: 14px;
    background: var(--surface); box-shadow: 0 18px 50px var(--shadow);
  }
  .symbol-picker.open .symbol-menu { display: block; }
  .symbol-option {
    width: 100%; border: 0; border-radius: 10px; padding: 9px 11px;
    background: transparent; color: var(--text); cursor: pointer;
    text-align: left; font-size: 12px; font-weight: 700;
  }
  .symbol-option:hover, .symbol-option[aria-selected="true"] {
    background: rgba(88,166,255,.13); color: var(--blue);
  }
  .theme-toggle { padding: 0 14px; cursor: pointer; }
  .symbol-button:hover, .theme-toggle:hover { border-color: var(--blue); }

  .layout {
    display: grid; grid-template-columns: 280px 1fr; gap: 0;
    flex: 1 1 auto; min-height: 0; overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card-title { font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }

  /* Statistics */
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: var(--muted); font-size: 12px; }
  .stat-value { font-weight: 600; font-size: 13px; }
  .green { color: var(--green); } .red { color: var(--red); } .yellow { color: var(--yellow); } .blue { color: var(--blue); }

  /* Win-rate bar */
  .winrate-bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .winrate-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width .5s ease; }

  /* Signal list */
  .signal-item {
    padding: 10px; border-radius: 6px; border: 1px solid var(--border);
    margin-bottom: 8px; cursor: pointer; transition: border-color .2s;
  }
  .signal-item:hover { border-color: var(--blue); }
  .signal-item.selected { border-color: var(--blue); background: rgba(88,166,255,.08); }
  .signal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .signal-strategy { font-size: 11px; font-weight: 700; letter-spacing: .5px; }
  .signal-outcome { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 3px; }
  .outcome-WIN_TP3, .outcome-WIN_TP2, .outcome-WIN_TP1  { background: rgba(63,185,80,.2); color: var(--green); }
  .outcome-LOSS                                           { background: rgba(248,81,73,.2); color: var(--red); }
  .outcome-TIMEOUT_PROFIT                                 { background: rgba(210,153,34,.2); color: var(--yellow); }
  .outcome-TIMEOUT_LOSS                                   { background: rgba(248,81,73,.1); color: var(--red); }
  .signal-meta { font-size: 11px; color: var(--muted); }
  .signal-r { font-size: 13px; font-weight: 700; }
  .signal-list-note { color: var(--muted); font-size: 11px; line-height: 1.4; margin-bottom: 10px; }

  /* Main content */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .chart-area { flex: 1; padding: 16px; min-height: 0; overflow: hidden; }
  canvas { width: 100% !important; }

  /* Detail panel */
  .detail-panel {
    border-top: 1px solid var(--border); padding: 16px 24px;
    background: var(--surface); display: none;
  }
  .detail-panel.show { display: block; }
  .detail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .detail-item .label { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .detail-item .value { font-size: 14px; font-weight: 600; }
  .detail-note {
    margin-top: 14px; padding: 12px; border: 1px solid var(--border);
    border-radius: 8px; background: rgba(88,166,255,.05);
  }
  .detail-note .label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .detail-note .value { font-size: 13px; line-height: 1.6; white-space: pre-wrap; }

  /* Empty state */
  .empty { text-align: center; padding: 40px; color: var(--muted); }
  .empty code { background: var(--border); padding: 2px 6px; border-radius: 3px; font-size: 12px; }

  /* Loading */
  #loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
  #loading p { color: var(--muted); font-size: 13px; margin-top: 12px; text-align: center; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .direction-LONG  { color: var(--green); }
  .direction-SHORT { color: var(--red); }

  @media (max-width: 820px) {
    html, body { overflow: auto; }
    header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .header-controls { width: 100%; }
    .symbol-picker, .symbol-button { flex: 1; width: 100%; }
    .symbol-menu { left: 0; right: auto; width: 100%; }
    .layout { grid-template-columns: 1fr; min-height: auto; overflow: visible; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 460px; }
    .chart-area { min-height: 420px; }
    .detail-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div id="loading">
  <div>
    <div class="spinner"></div>
    <p>載入資料中...</p>
  </div>
</div>

<header>
  <div class="brand">
    <h1>⚡ CHRONOS</h1>
    <div class="meta">BTCUSDT · 1H · 最後更新：<span id="lastUpdate">—</span></div>
  </div>
  <div class="header-controls" id="headerControls"></div>
</header>

<div class="layout">
  <!-- Sidebar: summary and latest signals -->
  <div class="sidebar">
    <div class="card" id="summaryCard">
      <div class="card-title">策略績效</div>
      <div id="summaryContent"><div class="empty">載入中...</div></div>
    </div>

    <div class="card" style="flex:1">
      <div class="card-title">訊號記錄</div>
      <div id="signalList"><div class="empty">載入中...</div></div>
    </div>
  </div>

  <!-- Main area: chart and signal detail -->
  <div class="main">
    <div class="chart-area">
      <canvas id="priceChart"></canvas>
    </div>
    <div class="detail-panel" id="detailPanel">
      <div class="detail-grid" id="detailGrid"></div>
      <div class="detail-note" id="detailNote" style="display:none">
        <div class="label">LLM 解釋</div>
        <div class="value" id="detailNoteContent"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:3001';
const SUPPORTED_SYMBOLS = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT'];
const SIGNAL_LIST_LIMIT = 10;
const THEME_KEY = 'chronos-theme';
const DISPLAY_TIMEZONE = 'Asia/Taipei';
const STRATEGY_LABELS = {
  TREND_LONG: '順勢多',
  TREND_SHORT: '順勢空',
  OVERSOLD_BOUNCE: '超賣反彈',
  OBS_BIAS_LONG: '觀察多',
  OBS_BIAS_SHORT: '觀察空',
};
let currentSymbol = new URLSearchParams(location.search).get('symbol') || 'BTCUSDT';
let priceChart = null;
let allSignals = [];
let allKlines  = [];

// Fetch helpers
async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function apiUrl(path) {
  return `${API}${path}?symbol=${encodeURIComponent(currentSymbol)}`;
}

function updateHeaderSymbol() {
  const meta = document.querySelector('header .meta');
  if (meta) meta.innerHTML = meta.innerHTML.replace(/^[A-Z]+USDT/, currentSymbol);
}

function initSymbolSelect() {
  if (document.getElementById('symbolPicker')) return;

  const picker = document.createElement('div');
  picker.id = 'symbolPicker';
  picker.className = 'symbol-picker';
  picker.innerHTML = `
    <button class="symbol-button" id="symbolButton" type="button" aria-haspopup="listbox" aria-expanded="false">${currentSymbol}</button>
    <div class="symbol-menu" id="symbolMenu" role="listbox" aria-label="交易對">
      ${SUPPORTED_SYMBOLS.map(symbol => `
        <button class="symbol-option" type="button" role="option" data-symbol="${symbol}" aria-selected="${symbol === currentSymbol}">
          ${symbol}
        </button>
      `).join('')}
    </div>
  `;

  const button = picker.querySelector('#symbolButton');
  const options = picker.querySelectorAll('.symbol-option');

  button.onclick = () => {
    const isOpen = picker.classList.toggle('open');
    button.setAttribute('aria-expanded', String(isOpen));
  };

  options.forEach(option => {
    option.onclick = () => {
      currentSymbol = option.dataset.symbol;
      button.textContent = currentSymbol;
      options.forEach(item => item.setAttribute('aria-selected', String(item === option)));
      picker.classList.remove('open');
      button.setAttribute('aria-expanded', 'false');
      updateHeaderSymbol();
      history.replaceState(null, '', `?symbol=${encodeURIComponent(currentSymbol)}`);
      init(false);
    };
  });

  document.addEventListener('click', (event) => {
    if (!picker.contains(event.target)) {
      picker.classList.remove('open');
      button.setAttribute('aria-expanded', 'false');
    }
  });

  document.getElementById('headerControls')?.appendChild(picker);
  updateHeaderSymbol();
}

function getCssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function chartColors() {
  return {
    text: getCssVar('--text'),
    muted: getCssVar('--muted'),
    border: getCssVar('--border'),
    grid: getCssVar('--chart-grid'),
    tooltipBg: getCssVar('--tooltip-bg'),
    green: getCssVar('--green'),
    red: getCssVar('--red'),
    yellow: getCssVar('--yellow'),
    blue: getCssVar('--blue'),
  };
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem(THEME_KEY, theme);

  const toggle = document.getElementById('themeToggle');
  if (toggle) toggle.textContent = theme === 'light' ? '夜間' : '日間';

  if (allKlines.length) renderChart(allKlines, allSignals);
}

function initThemeToggle() {
  if (document.getElementById('themeToggle')) return;

  const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
  document.documentElement.dataset.theme = savedTheme;

  const button = document.createElement('button');
  button.id = 'themeToggle';
  button.className = 'theme-toggle';
  button.type = 'button';
  button.textContent = savedTheme === 'light' ? '夜間' : '日間';
  button.onclick = () => {
    const nextTheme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    applyTheme(nextTheme);
  };

  document.getElementById('headerControls')?.appendChild(button);
}

function strategyLabel(strategy) {
  return STRATEGY_LABELS[strategy] || strategy;
}

// Formatting
function fmtTime(ms) {
  return new Date(ms).toLocaleString('zh-TW', {
    timeZone: DISPLAY_TIMEZONE,
    hour12: false,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
  }) + ` ${DISPLAY_TIMEZONE}`;
}

function fmtChartTime(ms) {
  return new Date(ms).toLocaleString('zh-TW', {
    timeZone: DISPLAY_TIMEZONE,
    hour12: false,
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
  });
}
function fmtR(r) {
  if (r == null) return '—';
  return (r > 0 ? '+' : '') + r + 'R';
}
function outcomeLabel(o) {
  const map = {
    WIN_TP3: '✅ TP3', WIN_TP2: '✅ TP2', WIN_TP1: '✅ TP1',
    LOSS: '❌ SL', TIMEOUT_PROFIT: '🟡 逾時盈', TIMEOUT_LOSS: '🔴 逾時虧',
  };
  return map[o] || o;
}

// Render strategy summary
function renderSummary(summary) {
  if (!summary || !Object.keys(summary).length) {
    document.getElementById('summaryContent').innerHTML =
      '<div class="empty">尚無資料<br><code>runVerification.js</code></div>';
    return;
  }
  let html = '';
  for (const [name, s] of Object.entries(summary)) {
    const rClass = s.avgR >= 0 ? 'green' : 'red';
    html += `
      <div style="margin-bottom:12px">
        <div style="font-size:12px;font-weight:700;margin-bottom:6px" title="${name}">${strategyLabel(name)}</div>
        <div class="stat-row"><span class="stat-label">樣本數</span><span class="stat-value">${s.total} 筆${s.total < 5 ? ' ⚠️' : ''}</span></div>
        <div class="stat-row"><span class="stat-label">勝 / 敗</span><span class="stat-value"><span class="green">${s.wins}</span> / <span class="red">${s.losses}</span></span></div>
        <div class="stat-row"><span class="stat-label">勝率</span><span class="stat-value ${s.winRate >= 50 ? 'green' : 'red'}">${s.winRate}%</span></div>
        <div class="stat-row"><span class="stat-label">平均R</span><span class="stat-value ${rClass}">${s.avgR > 0 ? '+' : ''}${s.avgR}</span></div>
        <div class="winrate-bar"><div class="winrate-fill" style="width:${s.winRate}%"></div></div>
      </div>`;
  }
  document.getElementById('summaryContent').innerHTML = html;
}

// Render latest signals only to keep the sidebar readable.
function renderSignalList(signals) {
  if (!signals.length) {
    document.getElementById('signalList').innerHTML =
      '<div class="empty">尚無訊號<br><code>fetchBTC.js</code> → <code>runVerification.js</code></div>';
    return;
  }
  const sorted = [...signals].reverse();
  const visibleSignals = sorted.slice(0, SIGNAL_LIST_LIMIT);
  let html = `<div class="signal-list-note">顯示最新 ${visibleSignals.length} / ${signals.length} 筆，完整資料仍保留於 JSON。</div>`;
  for (const sig of visibleSignals) {
    const v = sig.verification;
    const outcome = v?.outcome ?? 'PENDING';
    const r = v?.rMultiple;
    const rClass = r > 0 ? 'green' : r < 0 ? 'red' : 'yellow';
    html += `
      <div class="signal-item" data-id="${sig.id}" onclick="selectSignal('${sig.id}')">
        <div class="signal-header">
          <span class="signal-strategy direction-${sig.direction}" title="${sig.strategy}">${strategyLabel(sig.strategy)}</span>
          <span class="signal-outcome outcome-${outcome}">${outcomeLabel(outcome)}</span>
        </div>
        <div class="signal-meta">${fmtTime(sig.openTime)}</div>
        <div style="display:flex;justify-content:space-between;margin-top:4px">
          <span class="stat-label">@${sig.entryPrice.toLocaleString()}</span>
          <span class="signal-r ${rClass}">${fmtR(r)}</span>
        </div>
      </div>`;
  }
  document.getElementById('signalList').innerHTML = html;
}

// Select a signal and render detail panel.
function selectSignal(id) {
  document.querySelectorAll('.signal-item').forEach(el => el.classList.remove('selected'));
  document.querySelector(`[data-id="${id}"]`)?.classList.add('selected');

  const sig = allSignals.find(s => s.id === id);
  if (!sig) return;

  const v = sig.verification;
  const panel = document.getElementById('detailPanel');
  panel.classList.add('show');

  const items = [
    { label: '進場價',   value: sig.entryPrice?.toLocaleString() },
    { label: '出場價',   value: v?.exitPrice?.toLocaleString() ?? '—' },
    { label: '出場原因', value: v?.exitReason ?? '—' },
    { label: '結果',     value: v?.outcome ?? '—', cls: v?.outcome?.startsWith('WIN') ? 'green' : v?.outcome === 'LOSS' ? 'red' : 'yellow' },
    { label: 'R 倍數',   value: fmtR(v?.rMultiple), cls: v?.rMultiple > 0 ? 'green' : 'red' },
    { label: 'PnL',      value: v?.pnlPct != null ? (v.pnlPct > 0 ? '+' : '') + v.pnlPct + '%' : '—', cls: v?.pnlPct > 0 ? 'green' : 'red' },
    { label: 'MFE（最大浮盈）', value: v?.mfe?.toLocaleString() ?? '—' },
    { label: 'MAE（最大回撤）', value: v?.mae?.toLocaleString() ?? '—' },
    { label: 'SL',       value: v?.levels?.sl?.toLocaleString() ?? '—', cls: 'red' },
    { label: 'TP1',      value: v?.levels?.tp1?.toLocaleString() ?? '—', cls: 'green' },
    { label: 'TP2',      value: v?.levels?.tp2?.toLocaleString() ?? '—', cls: 'green' },
    { label: 'TP3',      value: v?.levels?.tp3?.toLocaleString() ?? '—', cls: 'green' },
  ];

  document.getElementById('detailGrid').innerHTML = items.map(it =>
    `<div class="detail-item"><div class="label">${it.label}</div><div class="value ${it.cls ?? ''}">${it.value}</div></div>`
  ).join('');

  const detailNote = document.getElementById('detailNote');
  const detailNoteContent = document.getElementById('detailNoteContent');
  if (sig.llm?.explanation) {
    detailNote.style.display = 'block';
    detailNoteContent.textContent = sig.llm.explanation;
  } else if (sig.llm?.error) {
    detailNote.style.display = 'block';
    detailNoteContent.textContent = `LLM 生成失敗：${sig.llm.error}`;
  } else {
    detailNote.style.display = 'none';
    detailNoteContent.textContent = '';
  }

  // Reserved for future chart annotation.
  highlightSignalOnChart(sig);
}

const candlestickPlugin = {
  id: 'candlestickOverlay',
  beforeDatasetsDraw(chart, _args, options) {
    const candles = options.candles || [];
    if (!candles.length) return;

    const { ctx, chartArea, scales } = chart;
    const xScale = scales.x;
    const yScale = scales.y;
    const colors = chartColors();
    const candleWidth = Math.max(3, Math.min(9, chartArea.width / candles.length * .55));

    ctx.save();
    ctx.lineWidth = 1;
    candles.forEach((kline, index) => {
      if ([kline.open, kline.high, kline.low, kline.close].some(value => value == null)) return;

      const x = xScale.getPixelForValue(index);
      const openY = yScale.getPixelForValue(kline.open);
      const closeY = yScale.getPixelForValue(kline.close);
      const highY = yScale.getPixelForValue(kline.high);
      const lowY = yScale.getPixelForValue(kline.low);
      const isUp = kline.close >= kline.open;
      const color = isUp ? colors.green : colors.red;
      const bodyTop = Math.min(openY, closeY);
      const bodyHeight = Math.max(1, Math.abs(closeY - openY));

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.globalAlpha = .9;
      ctx.beginPath();
      ctx.moveTo(x, highY);
      ctx.lineTo(x, lowY);
      ctx.stroke();
      ctx.globalAlpha = .88;
      ctx.fillRect(x - candleWidth / 2, bodyTop, candleWidth, bodyHeight);
      ctx.globalAlpha = .95;
      ctx.strokeRect(x - candleWidth / 2, bodyTop, candleWidth, bodyHeight);
    });
    ctx.restore();
  },
};

const signalMarkerPlugin = {
  id: 'signalMarkerOverlay',
  afterDatasetsDraw(chart, _args, options) {
    const markers = options.markers || [];
    const candles = options.candles || [];
    if (!markers.length) return;

    const { ctx, scales } = chart;
    const xScale = scales.x;
    const yScale = scales.y;
    const colors = chartColors();

    ctx.save();
    markers.forEach((marker, index) => {
      if (!marker || !candles[index]) return;

      const candle = candles[index];
      const color = markerColor(marker, colors);
      const x = xScale.getPixelForValue(index);
      const anchor = marker.direction === 'LONG'
        ? yScale.getPixelForValue(candle.low) + 10
        : yScale.getPixelForValue(candle.high) - 10;
      const size = 5;

      ctx.fillStyle = color;
      ctx.strokeStyle = getCssVar('--bg');
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (marker.direction === 'LONG') {
        ctx.moveTo(x, anchor - size);
        ctx.lineTo(x - size, anchor + size);
        ctx.lineTo(x + size, anchor + size);
      } else {
        ctx.moveTo(x, anchor + size);
        ctx.lineTo(x - size, anchor - size);
        ctx.lineTo(x + size, anchor - size);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.fill();
    });
    ctx.restore();
  },
};

Chart.register(candlestickPlugin, signalMarkerPlugin);

function markerColor(marker, colors) {
  const outcome = marker.outcome || '';
  if (outcome.startsWith('WIN')) return colors.green;
  if (outcome === 'LOSS' || outcome.endsWith('LOSS')) return colors.red;
  return colors.yellow;
}

// Render price, candlesticks, and indicators.
function renderChart(klines, signals) {
  const colors = chartColors();
  const labels   = klines.map(k => fmtChartTime(k.openTime));
  const closes   = klines.map(k => k.close);
  const ema20    = klines.map(k => k.indicators?.ema20  ?? null);
  const ema50    = klines.map(k => k.indicators?.ema50  ?? null);
  const ema200   = klines.map(k => k.indicators?.ema200 ?? null);
  const lows     = klines.map(k => k.low).filter(value => value != null);
  const highs    = klines.map(k => k.high).filter(value => value != null);
  const yPadding = (Math.max(...highs) - Math.min(...lows)) * .05;

  // Signal markers
  const signalPoints = klines.map(k => {
    const sig = signals.find(s => s.openTime === k.openTime);
    if (!sig) return null;
    return { price: sig.entryPrice, direction: sig.direction, outcome: sig.verification?.outcome };
  });

  if (priceChart) priceChart.destroy();

  const ctx = document.getElementById('priceChart').getContext('2d');
  priceChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Close', data: closes,
          borderColor: colors.blue, borderWidth: 1,
          borderDash: [3, 4],
          pointRadius: 0, pointHoverRadius: 0, tension: 0,
          fill: false,
        },
        { label: 'EMA20',  data: ema20,  borderColor: colors.green, borderWidth: 1, pointRadius: 0, tension: 0, fill: false },
        { label: 'EMA50',  data: ema50,  borderColor: colors.yellow, borderWidth: 1, pointRadius: 0, tension: 0, fill: false },
        { label: 'EMA200', data: ema200, borderColor: colors.red, borderWidth: 1, pointRadius: 0, tension: 0, fill: false },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        candlestickOverlay: { candles: klines },
        signalMarkerOverlay: { candles: klines, markers: signalPoints },
        legend: { labels: { color: colors.muted, boxWidth: 20, font: { size: 11 } } },
        tooltip: {
          backgroundColor: colors.tooltipBg, borderColor: colors.border, borderWidth: 1,
          titleColor: colors.text, bodyColor: colors.muted,
          callbacks: {
            afterBody: (items) => {
              const idx = items[0]?.dataIndex;
              const sig = signalPoints[idx];
              if (!sig) return '';
              return `\n▶ ${sig.direction} Signal\n  ${sig.outcome ?? 'PENDING'}`;
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: colors.muted, maxTicksLimit: 12, font: { size: 10 } }, grid: { color: colors.grid } },
        y: {
          suggestedMin: Math.min(...lows) - yPadding,
          suggestedMax: Math.max(...highs) + yPadding,
          ticks: { color: colors.muted, font: { size: 10 } },
          grid: { color: colors.grid },
        },
      },
    },
  });
}

// Main initialization
async function init(shouldInitSymbols = true) {
  try {
    if (shouldInitSymbols) {
      initSymbolSelect();
      initThemeToggle();
    }

    const [signals, klines, summary] = await Promise.all([
      fetchJson(apiUrl('/api/signals')),
      fetchJson(apiUrl('/api/klines')),
      fetchJson(apiUrl('/api/summary')),
    ]);

    allSignals = signals;
    allKlines  = klines;

    const latest = klines[klines.length - 1];
    document.getElementById('lastUpdate').textContent = fmtTime(latest.closeTime ?? latest.openTime);

    renderSummary(summary);
    renderSignalList(signals);
    renderChart(klines, signals);

    // Select the latest signal by default.
    if (signals.length) selectSignal(signals[signals.length - 1].id);

  } catch (err) {
    document.getElementById('loading').innerHTML =
      `<div style="text-align:center;color:#f85149">
        <div style="font-size:24px">⚠️</div>
        <p style="margin-top:8px">無法連線到 API Server</p>
        <p style="color:#8b949e;font-size:12px;margin-top:4px">請先執行：<code style="background:#30363d;padding:2px 6px;border-radius:3px">node src/scripts/dashboardServer.js</code></p>
      </div>`;
    return;
  }

  document.getElementById('loading').style.display = 'none';
}

init();
</script>
